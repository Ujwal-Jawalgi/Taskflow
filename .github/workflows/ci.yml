name: Backend CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: taskflow
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4
      
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          
      - name: Install dependencies
        run: npm install
        working-directory: ./backend
        
      - name: Setup Prisma and Push Schema
        run: npm run db:push
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql://user:password@localhost:5432/taskflow
          
      - name: Run Tests
        run: npm test
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql://user:password@localhost:5432/taskflow
